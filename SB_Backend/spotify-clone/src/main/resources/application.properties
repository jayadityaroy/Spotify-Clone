
# Application configuration for the Spotify Clone Spring Boot application.
# This file contains application-level properties used by Spring Boot and the app.
# Keep secrets out of source control ? see the JWT section below for guidance.

# -------------------------------------------------------------------------
# Application identity
# -------------------------------------------------------------------------
spring.application.name=spotify-clone
# Human-readable name for the application (used by Spring and some tooling).

# -------------------------------------------------------------------------
# Server
# -------------------------------------------------------------------------
server.port=8080
# Port the embedded server listens on (default 8080). Change for running multiple apps locally.

# -------------------------------------------------------------------------
# Database Configuration
# -------------------------------------------------------------------------
# JDBC connection URL for MySQL. Query parameters:
#  - createDatabaseIfNotExist=true : create the database automatically if missing (useful for local dev)
#  - useSSL=false                  : disable SSL for local development (do NOT disable in production)
# TLS (often called SSL) encrypts data between client and server and uses certificates to verify identities, ensuring confidentiality, integrity, and authentication.
# don't need to use SSL for local dev because the connection is local and not exposed to the internet
#  - serverTimezone=UTC            : ensures correct timezone handling by the driver
spring.datasource.url=jdbc:mysql://localhost:3306/spotify_clone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=12345

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JDBC driver class for MySQL Connector/J 8+

# -------------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# Controls schema generation:
#  - create / create-drop / update / validate / none
# 'update' is convenient for development; prefer 'validate' or managed migrations (Flyway/Liquibase) in production.

spring.jpa.show-sql=true
# Log SQL statements (useful for debugging). Turn off in high-volume production.

spring.jpa.properties.hibernate.format_sql=true
# Makes logged SQL easier to read by formatting it.

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Hibernate SQL dialect to use for MySQL 8.x

# -------------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------------
# The jwt.secret property is resolved from the environment variable JWT_SECRET_KEY.
# Spring's property placeholder ${...} resolves system properties and environment variables.
# - If you use: jwt.secret=${JWT_SECRET_KEY}
#     the application will expect JWT_SECRET_KEY to be set (it will be null/empty if missing).
# - Alternatively, provide a safe local fallback (only for development):
#     jwt.secret=${JWT_SECRET_KEY:dev-local-secret}
#   Do NOT keep a fallback in production.
#
# Security recommendations:
#  - Do NOT store jwt.secret in the repository.
#  - Use environment variables, a secrets manager (Vault, AWS Secrets Manager, Azure Key Vault), or container secrets.
#  - Rotate secrets periodically and restrict access to hosts/users that require them.
# Steps to set the environment variable :
# 1. click on the "Run" menu in your IDE and select "Edit Configurations"
# 2. if "Environment variables" field is not visible, click of the "Modify options" dropdown and select "Environment variables"
# 3. Click on the file icon next to the "Environment variables" field and add a new variable with the name JWT_SECRET_KEY and a strong secret value.
jwt.secret=${JWT_SECRET_KEY}

# Token expiration times (milliseconds)
# Access token lifetime (1 hour)
jwt.access.token.expiration=3600000

# Refresh token lifetime (7 days)
jwt.refresh.token.expiration=604800000

# -------------------------------------------------------------------------
# File storage and application URLs
# -------------------------------------------------------------------------
# Local paths where uploaded files will be stored. For production, prefer absolute paths
# or object storage (S3, Azure Blob) and configure via environment-based properties.
file.storage.song.path=uploads/songs
file.storage.image.path=uploads/images

# Base URL used when constructing links in emails or responses (adjust for prod)
app.base.url=http://localhost:8080

# -------------------------------------------------------------------------
# File upload configuration
# -------------------------------------------------------------------------
# Telling Spring Boot ?turn on built-in support for multipart/form-data (file upload) requests
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------------
# Mail / logging-related external service configuration
# -------------------------------------------------------------------------
# Gmail SMTP server used for sending email from the application.
spring.mail.host=smtp.gmail.com
# Port 587 is typically used for SMTP with STARTTLS encryption.
spring.mail.port=587
# Gmail username loaded from an environment variable to avoid hardcoding secrets.
spring.mail.username=${EMAIL_USERNAME}
# Gmail app password loaded from an environment variable.
# For Gmail, this is usually an App Password, not your normal account password.
spring.mail.password=${APP_PASSWORD}

# Enable SMTP authentication so the server accepts the login credentials above.
spring.mail.properties.mail.smtp.auth=true
# Enable STARTTLS so the connection is upgraded to a secure encrypted channel.
spring.mail.properties.mail.smtp.starttls.enable=true
# Require STARTTLS; the connection should not continue without encryption.
spring.mail.properties.mail.smtp.starttls.required=true
# Connection timeout for establishing the SMTP connection, in milliseconds.
spring.mail.properties.mail.smtp.connectiontimeout=5000
# Read timeout while waiting for SMTP responses, in milliseconds.
spring.mail.properties.mail.smtp.timeout=5000
# Write timeout while sending SMTP data, in milliseconds.
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend application URL used when building links in emails or redirects.
app.frontend.url=http://localhost:4200

# Gemini API key loaded from an environment variable for security.
gemini.api.key=${GEMINI_API_KEY}

# Comma-separated list of Gemini model names supported by the application.
#gemini.models=gemini-2.5-flash-lite,gemini-2.0-flash-lite,gemini-2.5-flash,gemini-2.0-flash-exp
gemini.models=models/gemini-3.5-flash-lite,models/gemini-3.5-flash,models/gemini-1.5-flash,models/gemini-1.5-flash-8b